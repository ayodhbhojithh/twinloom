  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;color:#5C574D\">SCOPING&nbsp;JOURNEY<\u002Fspan>\n      <span style=\"flex:1\"><\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;color:#5C574D\">STOP WHENEVER YOU LIKE · NOTHING HERE IS A QUOTE<\u002Fspan>\n      <button sc-camel-on-click=\"{{ openNotes }}\" style=\"display:flex;align-items:center;gap:8px;border:1px solid #E0E0DA;border-radius:999px;padding:7px 13px;white-space:nowrap\" style-hover=\"background:#E7E3D9\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em\">NOTES &amp; REFERENCES<\u002Fspan>\n        <span style=\"{{ noteCountS }}\">{{ noteCount }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#F6F6F4;border-bottom:1px solid #E8E8E3\">\n    <div style=\"max-width:1460px;margin:0 auto;padding:14px 40px 16px\">\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.14em;color:#6B6659\">EVERY SITE WE BUILD, WHATEVER ELSE YOU PICK<\u002Fspan>\n        <button sc-camel-on-click=\"{{ toggleInc }}\" style=\"{{ incLabelS }}\">{{ incLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:10px\">\n        <sc-for list=\"{{ incs }}\" as=\"i\" hint-placeholder-count=\"6\">\n          <span style=\"display:flex;flex-direction:column;gap:3px;background:#FFFFFF;border-radius:14px;padding:9px 14px;max-width:300px;box-shadow:0 1px 3px rgba(11,13,18,.06)\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:-.01em\">{{ i.t }}<\u002Fspan>\n            <sc-if value=\"{{ i.showD }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:11px;line-height:1.45;color:#6B6659;text-wrap:pretty\">{{ i.d }}<\u002Fspan>\n {{ c.trackS }}\"><span style=\"{{ c.barS }}\"><\u002Fspan><\u002Fspan>\n            <span style=\"{{ c.statS }}\">{{ c.stat }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1460px;margin:0 auto;padding:34px 40px 0;display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:48px;align-items:start\">\n\n    <div key=\"{{ areaKey }}\" style=\"animation:tlUp .3s ease both;min-width:0\">\n      <div style=\"{{ cur.eyebrowS }}\">{{ cur.eyebrow }}<\u002Fdiv>\n      <h2 style=\"font-size:40px;font-weight:800;letter-spacing:-.035em;margin:10px 0 0;line-height:1.05\">{{ cur.n }}<\u002Fh2>\n      <p style=\"font-size:15px;line-height:1.65;color:#57534E;margin:12px 0 0;max-width:680px;text-wrap:pretty\">{{ cur.lead }}<\u002Fp>\n\n      <sc-if value=\"{{ cur.isLayouts }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:24px\">\n          <sc-for list=\"{{ layouts }}\" as=\"l\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ l.pick }}\" style=\"{{ l.cardS }}\">\n              <span style=\"display:block;border-radius:14px;overflow:hidden;background:#FFFFFF\">{{ l.thumb }}<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:11px;margin-top:14px;padding:0 4px\">\n                <span style=\"{{ l.markS }}\">{{ l.mark }}<\u002Fspan>\n                <span style=\"font-size:14.5px;font-weight:700;letter-spacing:-.018em\">{{ l.n }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:block;font-size:11.5px;line-height:1.55;color:#57534E;margin:7px 4px 2px;text-wrap:pretty\">{{ l.w }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ skipLayout }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spa l-on-click=\"{{ s.set }}\" style=\"{{ s.wrapS }}\">\n                    <span style=\"{{ s.chipS }}\"><\u002Fspan>\n                    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:#6B6659\">{{ s.l }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ panel.hasAttach }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-top:1px solid #E8E8E3;padding-top:16px\">\n              <label style=\"display:flex;align-items:center;gap:9px;cursor:pointer;border:1px dashed #C8C2B6;border-radius:10px;padding:12px 14px;background:#FFFFFF\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.08em\">+ ATTACH<\u002Fspan>\n                <span style=\"font-size:12.5px;color:#6B6659;flex:1\">{{ panel.attachLabel }}<\u002Fspan>\n                <input type=\"file\" multiple=\"multiple\" sc-camel-on-change=\"{{ panel.onFile }}\" style=\"display:none\">\n              <\u002Flabel>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:9px\">\n                <sc-for list=\"{{ panel.files }}\" as=\"f\" hint-placeholder-count=\"0\">\n                  <span style=\"display:flex;align-items:center;gap:8px;background:#F5F5F2;border-radius:7px;padding:5px 9px 5px 11px\">\n                    <span style=\"font-size:11.5px;font-weight:600\">{{ f.n }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ f.rm }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5C574D\">×<\u002Fbutton>\n                  <\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"border-top:1px solid #E8E8E3;padding-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.6;letter-spacing:.04em;color:#5C574D;flex:1;min-width:190px\">{{ panel.defLine }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ panel.clear }}\" style=\"{{ panel.clearS }}\">CLEAR MY ANSWERS<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ closePanel }}\" style=\"background:#0B0D12;color:#FFFFFF;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:700;white-space:nowrap\" style-hover=\"background:#22252C\">Use this scope<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid #E8E8E3;padding-top:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;color:#6F6A60\">ANYTHING ELSE ABOUT THIS ONE<\u002Fdiv>\n            <textarea value=\"{{ panel.note }}\" sc-camel-on-change=\"{{ panel.onNote }}\" rows=\"2\" placeholder=\"In your own words. It lands in your notes, tied to this answer.\" style=\"width:100%;box-sizing:border-box;margin-top:9px;background:#FFFFFF;border:1px solid #E8E8E3;border-radius:10px;padding:10px 12px;outline:none;resize:vertical;font-size:13px;line-height:1.55\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ panel.isNotes }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;color:#6F6A60\">THE RUNNING NOTE<\u002Fdiv>\n          <div style=\"font-size:12px;color:#6B6659;margin-top:4px\">For anything that belongs to the whole request rather than one answer. This is where you say the thing you came to say.<\u002Fdiv>\n          <textarea value=\"{{ runNote }}\" sc-camel-on-change=\"{{ onRunNote }}\" rows=\"4\" placeholder=\"What went wrong last time, what you are trying to get away from, who has to be convinced…\" style=\"width:100%;box-sizing:border-box;margin-top:10px;background:#FFFFFF;border:1px solid #E8E8E3;border-radius:10px;padding:12px 13px;outline:none;resize:vertical;font-size:13px;line-height:1.6\"><\u002Ftextarea>\n\n          <div style=\"border-top:1px solid #E8E8E3;margin-top:20px;padding-top:16px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;color:#6F6A60\">ADD A REFERENCE<\u002Fdiv>\n            <input value=\"{{ draftUrl }}\" sc-camel-on-change=\"{{ onDraftUrl }}\" placeholder=\"A web address you like, or one to avoid\" style=\"width:100%;box-sizing:border-box;margin-top:9px;background:#FFFFFF;border:1px solid #E8E8E3;border-radius:10px;padding:10px 12px;outline:none;font-size:13px\">\n            <textarea value=\"{{ draftText }}\" sc-camel-on-change=\"{{ onDraftText }}\" rows=\"2\" placeholder=\"One line on what to look at, or a note of your own\" style=\"width:100%;box-sizing:border-box;margin-top:7px;background:#FFFFFF;border:1px solid #E8E8E3;border-radius:10px;padding:10px 12px;outline:none;resize:vertical;font-size:13px;line-height:1.55\"><\u002Ftextarea>\n            <div style=\"display:flex;align-items:center;gap:9px;margin-top:9px\">\n              <label style=\"display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid #E0E0DA;border-radius:9px;padding:8px 12px;background:#FFFFFF\">\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.08em\">+ FILES OR SCREENSHOTS<\u002Fspan>\n                <input type=\"file\" multiple=\"multiple\" sc-camel-on-change=\"{{ onDraftFile }}\" style=\"display:none\">\n              <\u002Flabel>\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#6F6A60;flex:1\">{{ draftFileLabel }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ addNote }}\" style=\"{{ addNoteS }}\">Add<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.6;letter-spacing:.03em;color:#6F6A60;margin-top:10px\">DOCUMENTS, SPREADSHEETS, PRESENTATIONS, IMAGES AND PDFS, UP TO 25&nbsp;MB EACH. ANYTHING LARGER, SEND A LINK INSTEAD.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid #E8E8E3;margin-top:20px;padding-top:16px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;color:#6F6A60\">{{ entriesLabel }}<\u002Fdiv>\n            <sc-for list=\"{{ entries }}\" as=\"e\" hint-placeholder-count=\"2\">\n              <div style=\"background:#FFFFFF;border:1px solid #E8E8E3;border-radius:11px;padding:13px 14px\">\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <button sc-camel-on-click=\"{{ e.go }}\" style=\"{{ e.tieS }}\">{{ e.tie }}<\u002Fbutton>\n                  <span style=\"flex:1\"><\u002Fspan>\n                  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6F6A60\">{{ e.when }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ e.rm }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6F6A60\">×<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"{{ e.textS }}\">{{ e.text }}<\u002Fdiv>\n                <div style=\"{{ e.urlS }}\">{{ e.url }}<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-top:7px\">\n                  <sc-for list=\"{{ e.files }}\" as=\"f\" hint-placeholder-count=\"0\">\n                    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;background:#F5F5F2;border-radius:6px;padding:4px 8px\">{{ f.n }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:70;background:rgba(11,13,18,.55);overflow-y:auto;animation:tlFade .2s ease both;padding:34px 24px 80px\">\n    <div style=\"max-width:1000px;margin:0 auto;background:#FFFFFF;border-radius:28px;box-shadow:0 40px 100px rgba(11,13,18,.28);animation:tlPop .3s cubic-bezier(.2,.8,.2,1) both\">\n\n      <div style=\"display:flex;align-items:center;gap:14px;padding:22px 40px;border-bottom:1px solid #EFEFEB;position:sticky;top:0;background:#FFFFFF;border-radius:28px 28px 0 0;z-index:2\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.2em\">TWINLOOM<\u002Fspan>\n        <span style=\"{{ dotS }}\"><\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:#5C574D\">{{ sheetEyebrow }}<\u002Fspan>\n        <span style=\"flex:1\"><\u002Fspan>\n        <button sc-camel-on-click=\"{{ closeSheet }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;color:#5C574D\" style-hover=\"color:#0B0D12\">CLOSE ✕<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isReport }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding:34px 40px 40px\">\n          <h2 style=\"font-size:38px;font-weight:800;letter-spacing:-.035em;margin:0;max-width:760px;text-wrap:pretty\">The site your answers describe<\u002Fh2>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:16px\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;background:#F5F5F2;border-radius:999px;padding:7px 13px\">{{ repDate }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;background:#F5F5F2;border-radius:999px;padding:7px 13px\">{{ pageCount }} PAGES<\u002Fspan>\n            <span style=\"{{ repStateS }}\">{{ readyState }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"background:#F7F7F5;border:1px solid #EFEFEB;border-radius:14px;padding:20px 22px;margin-top:24px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.14em;color:#5C574D\">WHAT GOOD LOOKS LIKE · OPTIONAL, AND THE ONE WE WOULD KEEP<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:600;margin-top:10px\">In a year, this website will have worked if…<\u002Fdiv>\n            <textarea value=\"{{ win }}\" sc-camel-on-change=\"{{ onWin }}\" rows=\"2\" placeholder=\"finish the sentence in your own words\" style=\"width:100%;box-sizing:border-box;margin-top:6px;background:transparent;border:none;outline:none;resize:vertical;font-family:'Caveat',cursive;font-size:25px;line-height:1.35;color:#0B0D12\"><\u002Ftextarea>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:#6F6A60\">QUOTED BACK WORD FOR WORD, AT THE TOP OF THE DOCUMENT WE SEND YOU<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ secS }}\">\n            <div style=\"{{ secNumS }}\">01<\u002Fdiv>\n            <div>\n              <h3 style=\"{{ secHeadS }}\">What you asked for<\u002Fh3>\n              <p style=\"font-size:15.5px;line-height:1.7;margin:10px 0 0;max-width:700px;text-wrap:pretty\">{{ repPara }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ secS }}\">\n            <div style=\"{{ secNumS }}\">02<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <h3 style=\"{{ secHeadS }}\">Every screen, by area<\u002Fh3>\n              <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:14px\">\n                <sc-for list=\"{{ sitemap }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div>\n                    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.12em;color:#5C574D;padding-bottom:7px;border-bottom:1px solid #EFEFEB\">{{ s.n }}<\u002Fdiv>\n                    <sc-for list=\"{{ s.pages }}\" as=\"p\" hint-placeholder-count=\"3\">\n                      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid #F5F5F2\">\n                        <span style=\"font-size:14px;font-weight:600;letter-spacing:-.012em\">{{ p.n }}<\u002Fspan>\n                        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:#5C574D;text-align:right\">{{ p.from }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ secS }}\">\n            <div style=\"{{ secNumS }}\">03<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <h3 style=\"{{ secHeadS }}\">What you told us<\u002Fh3>\n              <div style=\"display:flex;flex-direction:column;gap:18px;margin-top:14px\">\n                <sc-for list=\"{{ told }}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <div>\n                    <div style=\"display:flex;align-items:baseline;gap:10px;padding-bottom:7px;border-bottom:1px solid #EFEFEB\">\n                      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.12em;color:#5C574D\">{{ t.n }}<\u002Fspan>\n                      <span style=\"flex:1\"><\u002Fspan>\n                      <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.s }}\">CHANGE IT<\u002Fbutton>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ t.lines }}\" as=\"l\" hint-placeholder-count=\"3\">\n                      <div style=\"display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;padding:8px 0;border-bottom:1px solid #F5F5F2\">\n                        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.5;color:#5C574D\">{{ l.q }}<\u002Fspan>\n                        <span style=\"{{ l.aS }}\">{{ l.a }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ secS }}\">\n            <div style=\"{{ secNumS }}\">04<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <h3 style=\"{{ secHeadS }}\">What we assumed<\u002Fh3>\n              <p style=\"font-size:13px;line-height:1.6;color:#6B6659;margin:8px 0 0;max-width:620px\">Kept apart from what you answered, and never blended into it. Touching any of these makes it yours instead of ours.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;margin-top:12px\">\n                <sc-for list=\"{{ assumed }}\" as=\"a\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:9px 0;border-bottom:1px solid #F5F5F2\">\n                    <span style=\"font-size:13.5px;line-height:1.5\">{{ a.l }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ a.go }}\" style=\"{{ a.s }}\">ANSWER IT<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ secS }}\">\n            <div style=\"{{ secNumS }}\">05<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <h3 style=\"{{ secHeadS }}\">Your reference points<\u002Fh3>\n              <div style=\"{{ runS }}\">{{ runNote }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                <sc-for list=\"{{ entries }}\" as=\"e\" hint-placeholder-count=\"2\">\n                  <div style=\"background:#F7F7F5;border-radius:11px;padding:13px 15px\">\n                    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.1em;color:#5C574D\">{{ e.tie }}<\u002Fdiv>\n                    <div style=\"{{ e.textS }}\">{{ e.text }}<\u002Fdiv>\n                    <div style=\"{{ e.urlS }}\">{{ e.url }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-top:7px\">\n                      <sc-for list=\"{{ e.files }}\" as=\"f\" hint-placeholder-count=\"0\">\n                        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;background:#FFFFFF;border-radius:6px;padding:4px 8px\">{{ f.n }}<\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"{{ noEntryS }}\">Nothing here yet. Anything you add in the notes panel arrives in this section, under the answer it belongs to.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ secS }}\">\n            <div style=\"{{ secNumS }}\">06<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <h3 style=\"{{ secHeadS }}\">What we will need from you<\u002Fh3>\n              <p style=\"font-size:13px;line-height:1.6;color:#6B6659;margin:8px 0 0;max-width:620px\">A build almost never stalls on the code. It stalls waiting for a logo file, or for one person who can say yes. You can start gathering these today.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;margin-top:12px\">\n                <sc-for list=\"{{ needs }}\" as=\"n\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:start;padding:11px 0;border-bottom:1px solid #F5F5F2\">\n                    <span style=\"{{ n.markS }}\">{{ n.mark }}<\u002Fspan>\n                    <span style=\"display:block;min-width:0\">\n                      <span style=\"display:block;font-size:14px;font-weight:700;letter-spacing:-.014em\">{{ n.need }}<\u002Fspan>\n                      <span style=\"display:block;font-size:12.5px;line-height:1.55;color:#6B6659;margin-top:4px;text-wrap:pretty\">{{ n.why }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"{{ n.stateS }}\">{{ n.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"{{ secS }}\">\n            <div style=\"{{ secNumS }}\">07<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <h3 style=\"{{ secHeadS }}\">What happens next<\u002Fh3>\n              <div style=\"display:flex;flex-direction:column;margin-top:12px\">\n                <sc-for list=\"{{ next }}\" as=\"s\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:26px minmax(0,1fr) 150px;gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid #F5F5F2\">\n                    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;color:#6F6A60;padding-top:2px\">{{ s.i }}<\u002Fspan>\n                    <span style=\"display:block;min-width:0\">\n                      <span style=\"display:block;font-size:14px;font-weight:700;letter-spacing:-.014em\">{{ s.n }}<\u002Fspan>\n                      <span style=\"display:block;font-size:12.5px;line-height:1.55;color:#6B6659;margin-top:4px;text-wrap:pretty\">{{ s.d }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"{{ s.whenS }}\">{{ s.when }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:16px;margin-top:34px;padding:22px 24px;background:#0B0D12;border-radius:14px;flex-wrap:wrap\">\n            <span style=\"display:block;max-width:430px\">\n              <span style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.14em;color:rgba(255,255,255,.66)\">WHAT THIS IS NOT<\u002Fspan>\n              <span style=\"display:block;font-size:14px;line-height:1.55;color:#FFFFFF;margin-top:7px;text-wrap:pretty\">This is a scope, not a quote. Nothing in it is priced, and it says which answers were yours and which were ours.<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <button sc-camel-on-click=\"{{ closeSheet }}\" style=\"flex-shrink:0;white-space:nowrap;border:1px solid rgba(255,255,255,.66);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:700;color:#FFFFFF\" style-hover=\"background:rgba(255,255,255,.1)\">Keep answering<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ openWho }}\" style=\"flex-shrink:0;white-space:nowrap;background:#FFFFFF;border-radius:10px;padding:12px 20px;font-size:13.5px;font-weight:700;letter-spacing:-.01em;color:#0B0D12\" style-hover=\"background:#FFFFFF\">Send this to us<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isWho }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:34px 40px 40px;max-width:720px\">\n          <h2 style=\"font-size:32px;font-weight:800;letter-spacing:-.032em;margin:0\">Who is asking?<\u002Fh2>\n          <p style=\"font-size:14.5px;line-height:1.65;color:#5C574D;margin:10px 0 0;text-wrap:pretty\">Asked here rather than at the start, because by now you have built the thing you came to build. Four fields, and none of it is shown back to you as a grade.<\u002Fp>\n          <div style=\"{{ readyBoxS }}\">\n            <span style=\"{{ readyDotS }}\"><\u002Fspan>\n            <span style=\"display:block\">\n              <span style=\"display:block;font-size:14px;font-weight:700\">{{ readyState }}<\u002Fspan>\n              <span style=\"display:block;font-size:12.5px;line-height:1.5;color:#6B6659;margin-top:3px\">{{ readyLong }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px\">\n            <label style=\"display:block\">\n              <span style=\"{{ fieldLabS }}\">YOUR NAME · REQUIRED<\u002Fspan>\n              <input value=\"{{ who.name }}\" sc-camel-on-change=\"{{ who.onName }}\" placeholder=\"First and last\" style=\"{{ fieldS }}\">\n            <\u002Flabel>\n            <label style=\"display:block\">\n              <span style=\"{{ fieldLabS }}\">COMPANY · REQUIRED<\u002Fspan>\n              <input value=\"{{ who.company }}\" sc-camel-on-change=\"{{ who.onCompany }}\" placeholder=\"So we can look at what exists before we call\" style=\"{{ fieldS }}\">\n            <\u002Flabel>\n            <label style=\"display:block\">\n              <span style=\"{{ fieldLabS }}\">EMAIL · REQUIRED<\u002Fspan>\n              <input value=\"{{ who.email }}\" sc-camel-on-change=\"{{ who.onEmail }}\" placeholder=\"Where the document is sent\" style=\"{{ fieldS }}\">\n            <\u002Flabel>\n            <label style=\"display:block\">\n              <span style=\"{{ fieldLabS }}\">PHONE · OPTIONAL<\u002Fspan>\n              <input value=\"{{ who.phone }}\" sc-camel-on-change=\"{{ who.onPhone }}\" placeholder=\"Only if a reply bounces\" style=\"{{ fieldS }}\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"margin-top:20px\">\n            <span style=\"{{ fieldLabS }}\">WHAT PART DO YOU PLAY IN THIS DECISION · REQUIRED<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:9px\">\n              <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ r.set }}\" style=\"{{ r.s }}\" style-hover=\"border-color:#0B0D12\">{{ r.l }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:20px\">\n            <span style=\"{{ fieldLabS }}\">AND A CONVERSATION, HOWEVER YOU WANT IT<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:9px\">\n              <sc-for list=\"{{ talks }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ t.set }}\" style=\"{{ t.s }}\" style-hover=\"border-color:#0B0D12\">{{ t.l }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;margin-top:26px;padding-top:20px;border-top:1px solid #EFEFEB\">\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;line-height:1.6;letter-spacing:.04em;color:#5C574D;max-width:330px\">WE COME BACK WITHIN TWO WORKING DAYS. THAT IS {{ replyBy }}.<\u002Fspan>\n            <span style=\"flex:1\"><\u002Fspan>\n            <button sc-camel-on-click=\"{{ backToReport }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.1em;color:#5C574D\" style-hover=\"color:#0B0D12\">BACK TO THE DOCUMENT<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ submit }}\" style=\"{{ submitS }}\">{{ submitLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:44px 40px 46px;max-width:700px\">\n          <div style=\"{{ sentEyebrowS }}\">SENT · {{ repDate }}<\u002Fdiv>\n          <h2 style=\"font-size:34px;font-weight:800;letter-spacing:-.034em;margin:12px 0 0;text-wrap:pretty\">{{ sentHead }}<\u002Fh2>\n          <p style=\"font-size:15px;line-height:1.7;color:#5C574D;margin:12px 0 0;text-wrap:pretty\">{{ sentBody }}<\u002Fp>\n          <div style=\"display:flex;flex-dire }}\">\nclass Component extends DCLogic {\n  state = {\n    area: 0, picks: (function () { const p = {}; ((window.TL || {}).AREAS || []).forEach(a => (a.bands || []).forEach(b => b.rows.forEach(r => { if (r.on) p[r.id] = true; }))); return p; })(),\n    det: {}, tri: {}, dnote: {}, dfiles: {},\n    aNote: {}, aFiles: {}, sw: [], top: [], layout: null, short: false,\n    notes: [], run: '', win: '', panel: null, sheet: null, inc: false,\n    who: { name: '', company: '', email: '', phone: '', role: '', talk: '' }, sent: false,\n    seen: {}\n  };\n\n  D() { return window.TL || { AREAS: [], INCLUDES: [], NEED: [], NEXT: [], L2: {}, TRIAGE: [], SWATCHES: [], ROLES: [], BASE_PAGES: [] }; }\n\n  componentDidMount() {\n    this._key = (e) => {\n      const t = e.target || {};\n      if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') return;\n      if (this.state.panel || this.state.sheet) return;\n      if (e.key === 'ArrowRight') this.goArea(this.state.area + 1);\n      if (e.key === 'ArrowLeft') this.goArea(this.state.area - 1);\n    };\n    window.addEventListener('keydown', this._key);\n    setTimeout(() => { const r = this._rail; if (r && r.scrollWidth > r.clientWidth + 20) { r.scrollLeft = 46; setTimeout(() => { r.scrollLeft = 0; }, 420); } }, 700);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._key); }\n\n  // ---- model helpers -------------------------------------------------------\n  areas() { return this.D().AREAS.filter(a => !a.gate || this.state.picks[a.gate]); }\n  areaAt(i) { const as = this.areas(); return as[Math.max(0, Math.min(as.length - 1, i))]; }\n  bandOn(b) {\n    if (!b.band) return true;\n    const p = this.state.picks;\n    if (b.band === 'customers') return !!(p.gCust || p.gExist);\n    if (b.band === 'business') return !!p.gBiz;\n    if (b.band === 'investors') return !!p.gInv;\n    if (b.band === 'franchise') return !!p.gFran;\n    if (b.band === 'staff') return !!p.gStaff;\n    if (b.band === 'press') return    const miss = [];\n    if (!groups && !s) miss.push({ l: 'WHO IT IS FOR', area: 'visitors' });\n    if (!extra && !s) miss.push({ l: 'WHAT PEOPLE DO THERE', area: 'actions' });\n    if (!shopOk) miss.push({ l: 'THE FRONT DOOR OF THE SHOP', area: 'selling' });\n    return { miss, who, n: miss.length };\n  }\n\n  // ---- actions -------------------------------------------------------------\n  goArea(i) { const as = this.areas(); const n = Math.max(0, Math.min(as.length - 1, i)); this.setState({ area: n }); this.scrollRailTo(n); }\n  goAreaKey(k) { const i = this.areas().findIndex(a => a.k === k); if (i >= 0) this.setState({ area: i, panel: null, sheet: null }, () => this.scrollRailTo(i)); }\n  scrollRailTo(i) { const r = this._rail; if (r && r.children[i]) { const c = r.children[i]; r.scrollLeft = Math.max(0, c.offsetLeft - 40); } }\n  toggle(r) {\n    const was = !!this.state.picks[r.id];\n    const p = Object.assign({}, this.state.picks);\n    if (r.excl) { this.allRows().forEach(x => { if (x.r.excl === r.excl) delete p[x.r.id]; }); p[r.id] = true; }\n    else if (p[r.id]) delete p[r.id]; else p[r.id] = true;\n    const top = this.state.top.filter(id => p[id]);\n    this.setState({ picks: p, top });\n  }\n\n  // Defaults: what we assume when nobody opens the detail. Derived from the other\n  // answers where that is honest, otherwise the commonest answer. Never overwrites\n  // anything the visitor has set themselves.\n  defaults(l2key) {\n    const p = this.state.picks, tri = this.state.tri;\n    const d = {\n      booking: { how: 'Pick a slot from a live diary', pay: 'No, nothing' },\n      locations: { come: 'Yes', many: 'One' },\n      signin: { diff: 'No, everyone sees the same', off: 'We would like to do it ourselves' },\n      credential: { src: 'A spreadsheet we keep' },\n      physical: { count: 'Dozens', variants: 'Sizes or colours', reg: 'No', delivery: 'One flat method', returns: ['Returns and refunds'], ready: 'Partly' },\n      downloads: { size: 'Sm
